name: Automated ML Pipeline
on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
jobs:
  run-preprocessing:
     runs-on: ubuntu-latest
     steps:
#1.checkout repository code
     - name: Checkout code
       uses: action/checkout@v4
#2.Setup Python environment
     - name: Set up Python 
       uses: action/setup-python@v5
       with:
            python-version: "3.10"
            cache: 'pip'
#3.install project dependencies
     - name: install Dependencies
       run: python-m pip install--upgrade pip
        pip install pandas scikit-learn pytest
#4.Run your preprocessing or test script
     - name: Run Preprocessing & Tests
       run: python preprocessing.py
